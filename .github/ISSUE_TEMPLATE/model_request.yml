name: Model Request
description: "Request support for a new camera model."
title: "[Model Request] "
labels: ["model-request"]
body:
  - type: input
    id: brand
    attributes:
      label: "Camera brand"
      placeholder: "Motorola, Luvion, etc."
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "Commercial model"
      placeholder: "FOCUS 71"
    validations:
      required: true
  - type: input
    id: model_id
    attributes:
      label: "Model ID (if known)"
      placeholder: "0571"
    validations:
      required: false
  - type: input
    id: firmware
    attributes:
      label: "Firmware version"
      placeholder: "03.30.52"
    validations:
      required: false
  - type: input
    id: soc
    attributes:
      label: "SoC version"
      placeholder: "1906_2011"
    validations:
      required: false
  - type: input
    id: app
    attributes:
      label: "Mobile application"
      placeholder: "Application used to manage the camera"
    validations:
      required: true
  - type: dropdown
    id: behavior
    attributes:
      label: "Current integration behavior"
      options:
        - "Camera is not discovered"
        - "Camera is discovered but unavailable"
        - "Camera is discovered but missing features"
        - "Not tested yet"
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: "Native camera capabilities"
      description: "List features available through the official application."
  - type: textarea
    id: logs
    attributes:
      label: "Diagnostic logs"
      description: "Remove credentials, tokens, serial numbers and sensitive identifiers before sharing."
  - type: dropdown
    id: testing
    attributes:
      label: "Are you willing to test development builds?"
      options:
        - "Yes"
        - "No"
    validations:
      required: false
